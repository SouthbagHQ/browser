<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Southbag Terminal</title>
  <link rel="icon" href="mark.png">
  <link rel="stylesheet" href="internal.css">
</head>
<body>
  <header class="page-header">
    <img src="logo.png" alt="Southbag">
    <h2>Southbag Terminal</h2>
  </header>
  <main>
    <h1 class="blurred" id="title">Opening Southbag Terminal…</h1>
    <p id="detail" class="muted">Please hold. Your shell is important to us.</p>
    <div class="row">
      <button type="button" id="again" class="btn-large btn-primary" data-track="terminal_again">Open Southbag Terminal</button>
      <a id="download" href="https://github.com/SouthbagHQ/terminal/releases" hidden>Download Southbag Terminal</a>
    </div>
  </main>
  <footer class="site-footer">Southbag Global Enterprise Network. Every shell is monitored for quality and compliance purposes.</footer>
  <script src="internal.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
