<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>History</title>
  <link rel="icon" href="mark.png">
  <link rel="stylesheet" href="internal.css">
</head>
<body>
  <header class="page-header">
    <img src="logo.png" alt="Southbag">
    <h2>History</h2>
  </header>
  <main>
    <h1 class="blurred">History</h1>
    <div class="row">
      <input id="filter" type="search" placeholder="Search history (stays on this computer)" size="40">
      <button type="button" id="clearAll" class="btn-small" data-track="history_clear">clear all history</button>
      <span id="count" class="muted"></span>
    </div>
    <p class="fine-print">History is kept on this computer only. Incognito* windows do not add to it. Palantir is told that you visited pages, never which ones.</p>
    <div id="days"></div>
  </main>
  <footer class="site-footer">Southbag Global Enterprise Network. This page may be monitored for quality and compliance purposes.</footer>
  <script src="internal.js"></script>
  <script src="history.js"></script>
</body>
</html>
